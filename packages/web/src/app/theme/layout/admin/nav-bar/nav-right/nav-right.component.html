<ul id="nav-right-container" class="navbar-nav ml-auto">
    <li>
        <span>{{firstName}} {{lastName}}</span>
    </li>
    <li>
        <select id="language-select" [(ngModel)]="selectedLanguage" (change)="changeLanguage($event.target.value)" class="custom-select">
            <option value="en">En</option>
            <option value="uk">Ук</option>
            <option value="ru">Ру</option>
            <option value="fr">Fr</option>
            <option value="es">Es</option>
          </select>
    </li>
    <li>
        <app-notification-bell [userId]="userId"></app-notification-bell>
    </li>

    <li>
        <div >
            <a href="javascript:" >
                <i class="icon feather icon-user"
                   [matMenuTriggerFor]="menuSettings"
                ></i>
                <!--          </ng-template>-->
            </a>
            <div >
                <mat-menu  #menuSettings="matMenu" class="settings-mat-menu">
                    <div mat-menu-item
                         class="one-notification"
                         [routerLink]="['/pages/user-profile/'+userId]">
                        <i class="feather icon-user"></i>
                        &nbsp;
                        {{'menu.menu_item.profile' | translate}}
                    </div>
                    <div mat-menu-item
                         class="one-notification"
                         href="javascript:" (click)="logout()" title="Logout">
                        <i class="feather icon-log-out" ></i>
                        &nbsp;
                        {{'menu.menu_item.log_out' | translate}}
                    </div>
                </mat-menu>
            </div>
        </div>
    </li>
</ul>
