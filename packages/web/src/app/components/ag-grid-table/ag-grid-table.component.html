<div id="{{tableId()}}" class="ag-grid-full-height">
    <ag-grid-angular
            class="ag-theme-material ag-grid-angular-style ag-test"
            #agGrid
            [rowData]="rowData()"
            [animateRows]="true"
            [columnDefs]="columnDefs()"
            [defaultColDef]="defaultColDef"
            [rowHeight]="38"
            [components]="components()"
            [headerHeight]="81"
            [enableCellTextSelection]="true">
    </ag-grid-angular>
</div>
