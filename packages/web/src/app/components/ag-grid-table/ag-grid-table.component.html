<div id="{{tableId()}}" class="ag-grid-full-height">
    <ag-grid-angular
            class="ag-theme-material ag-grid-angular-style ag-test"
            #agGrid
            [rowData]="rowData()"
            [animateRows]="true"
            [columnDefs]="columnDefs()"
            [defaultColDef]="defaultColDef"
            [rowHeight]="rowHeight()"
            [components]="components()"
            [context]="context()"
            [headerHeight]="headerHeight()"
            [enableCellTextSelection]="true"
            (gridSizeChanged)="onGridSizeChanged()">
    </ag-grid-angular>
</div>
