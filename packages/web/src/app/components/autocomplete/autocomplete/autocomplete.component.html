<mat-form-field class="example-chip-list" appearance="outline">
    <mat-label>{{nameOfList}}</mat-label>
    <mat-chip-grid #chipList [attr.aria-label]="'autocomplete.item_selection' | translate" >
        <mat-chip-row
                color="primary"
                *ngFor="let item of selectedData"
                [removable]="removable"
                (removed)="remove(item)">
            {{item.group}}
                <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
        </mat-chip-row>
        <input
                #elementInput
                [formControl]="elementCtrl"
                [matAutocomplete]="auto"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                (matChipInputTokenEnd)="add($event)">
    </mat-chip-grid>
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
        <mat-option *ngFor="let item of filteredElements | async" [value]="item">
            {{item.group}}
        </mat-option>
    </mat-autocomplete>
</mat-form-field>
