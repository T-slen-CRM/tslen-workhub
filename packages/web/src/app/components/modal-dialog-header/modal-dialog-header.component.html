<div class="header-container">
  <div class="header-left">
    <h5 mat-dialog-title>
      {{
        titleDate
          | date
            : 'EEEE, MMMM d, y'
            : undefined
            : translateService.calendarLocale
          | titlecase
      }}
    </h5>
    @if (tooltipText) {
    <mat-icon
      matTooltipPosition="right"
      class="header-icon"
      [matTooltip]="tooltipText"
      >info_outline</mat-icon
    >
    }
  </div>
  <div>
    <button mat-icon-button color="primary" (click)="closeDialog.emit(true)">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
