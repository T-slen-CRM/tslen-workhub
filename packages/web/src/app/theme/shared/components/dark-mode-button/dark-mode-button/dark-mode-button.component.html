

<div class="main-switch-container">


        <label class="switch">
            <div [class.spinner]="loading">
            <input [checked]="isDarkTheme" type="checkbox" (change)="changeThemeColor()" [disabled]="loading">
            <span class="slider round"></span>
            <i class="feather icon-sun icon-switcher-dark"></i>
            <i class="feather icon-moon icon-switcher-white"></i>
            </div>
        </label>
    <span class="button-mode-text">{{'dark_mode_button.change_mode' | translate}}</span>

</div>
