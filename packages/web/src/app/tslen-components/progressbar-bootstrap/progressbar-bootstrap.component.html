@for (progressInfo of progressInfos; track progressInfo) {
<div class="mb-2">
  <span>{{ progressInfo.name }}</span>
  <div class="progress">
    <div
      class="progress-bar progress-bar-info"
      role="progressbar"
      attr.aria-valuenow="{{ progressInfo.value }}"
      aria-valuemin="0"
      aria-valuemax="100"
      [ngStyle]="{ width: progressInfo.value + '%' }"
    >
      {{ progressInfo.value }}%
    </div>
  </div>
</div>
}
