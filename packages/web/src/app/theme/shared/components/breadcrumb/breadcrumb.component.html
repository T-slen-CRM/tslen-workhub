<ng-container *ngIf="this.navigationList">
  <ng-container *ngFor="let breadcrumb of navigationList; let last = last">
    <div class="page-header" *ngIf="last && breadcrumb.breadcrumbs !== false">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-6">
            <div class="page-header-title">
              <ng-container *ngFor="let breadcrumb of navigationList; let last = last"><h5 class="m-b-10" *ngIf="last">{{breadcrumb.title | translate}}</h5></ng-container>
            </div>
            <ul class="breadcrumb">
              <li class="breadcrumb-item">
                <a [routerLink]="['/dashboard/analytics/']" *ngIf="type === 'theme2'" class="custom-header-items"><i class="feather icon-home"></i></a>
                <a [routerLink]="['/dashboard/analytics/']" *ngIf="type === 'theme1'" class="custom-header-items">Home</a>
              </li>
              <ng-container *ngFor="let breadcrumb of navigationList">
                <li class="breadcrumb-item" *ngIf="breadcrumb.url !== false"><a [routerLink]="breadcrumb.url" class="custom-header-items">{{breadcrumb.title | translate}}</a></li>
                <li class="breadcrumb-item" *ngIf="breadcrumb.url === false"><a href="javascript:" class="custom-header-items">{{breadcrumb.title | translate}}</a></li>
              </ng-container>
            </ul>
          </div>
<!--          <div class="col-md-6">-->
<!--            <div *ngIf="isManager">-->
<!--                <app-invited-link [userId]="userId"></app-invited-link>-->
<!--            </div>-->
<!--          </div>-->
        </div>
      </div>
    </div>
  </ng-container>
</ng-container>
