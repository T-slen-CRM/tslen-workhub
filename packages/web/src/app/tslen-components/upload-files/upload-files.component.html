<div class="file-input">
    <mat-label>{{uploadLabel}}</mat-label>
    <button class="file-button"  mat-raised-button
            (click)="fileInput.click()"
            [disabled]="disableSelect"
    >
        {{"task.form.button.select"| translate}}
    </button>
    <input
            hidden
            type="file"
            [multiple]="multipleSelection"
            #fileInput
            (change)="selectFiles($event)"
            [accept]="acceptedFileTypes"
            multiple
    />
</div>
