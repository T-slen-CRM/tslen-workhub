<div class="call-window">
    <div class="call-title">{{'call_model.outgoing_call.title' | translate}}</div>
    <img class="avatar" [src]="data.avatar" alt="avatar">
    <div class="call-text">{{'call_model.outgoing_call.text' | translate}} {{data.firstName}} {{data.lastName}} ...</div>
    <button class="call-action-btn call-action-btn--reject" [attr.aria-label]="'call_model.outgoing_call.cancel' | translate" (click)='cancelCall()'>
        <mat-icon>call_end</mat-icon>
    </button>
  </div>
