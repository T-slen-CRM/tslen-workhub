<div class="auth-wrapper">
  <div class="blur-bg-images"></div>
  <!-- [ change-password ] start -->
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center">
        <div class="col-md-12">
          <div class="card-body">
            <img src="../../../../assets/images/logo-dark.png" alt="" class="img-fluid mb-4">
            <h4 class="mb-4 f-w-400">{{'auth_change_password.title' | translate}}</h4>
            <div class="input-group mb-2">
              <input type="password" class="form-control" [placeholder]="'auth_change_password.current_password' | translate">
            </div>
            <div class="input-group mb-2">
              <input type="password" class="form-control" [placeholder]="'auth_change_password.new_password' | translate">
            </div>
            <div class="input-group mb-4">
              <input type="password" class="form-control" [placeholder]="'auth_change_password.retype_new_password' | translate">
            </div>
            <button class="btn btn-block btn-primary mb-4">{{'auth_change_password.submit' | translate}}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- [ change-password ] end -->
</div>
