<div class="task-comments">
  <h4>{{'task_comments.title' | translate}}</h4>
  <ul class="task-comments-list">
    <li *ngFor="let comment of comments">
      <strong>{{ comment.user.firstName }} {{ comment.user.lastName }}</strong>
      <span class="task-comments-timestamp">{{ comment.createdAt | date:'short' }}</span>
      <p>{{ comment.content }}</p>
    </li>
  </ul>
  <div class="task-comments-form">
    <textarea
      [(ngModel)]="newCommentContent"
      [placeholder]="'task_comments.placeholder' | translate"
      rows="2"
    ></textarea>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="postComment()"
      [disabled]="!newCommentContent.trim()"
    >{{'task_comments.post' | translate}}</button>
  </div>
</div>
