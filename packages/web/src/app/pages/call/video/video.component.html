
<div #videoContainer [class]="getContainerClasses()">
    <video
        #videoElement
        [style.object-fit]="getObjectFit()"
        [style.transform]="getTransform()"
        autoplay
        muted
        playsinline>
    </video>

    <div class="participant-data">
        <p>{{ participantIdentity() }}</p>
    </div>

    @if (!isThumbnail()) {
        <button
            mat-icon-button
            class="video-expand-btn"
            (click)="toggleFullscreen()"
        >
            <mat-icon>{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
    }
</div>
