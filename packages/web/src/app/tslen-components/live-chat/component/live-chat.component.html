<div class="live-chat-container">
  <!-- Header with user info -->
  @if (selectedChatId()) {
  <div class="live-chat-header">
    @if (localUserData() && selectedChatId()?.id && localUserData().id !==
    selectedChatId()?.id) {
    <app-call-button-renderer
      [selectedUserId]="$safeNavigationMigration(selectedChatId()?.id)"
    ></app-call-button-renderer>
    }
    <p class="chat-user-name">
      {{ selectedChatId()?.firstName }} {{ selectedChatId()?.lastName }}
    </p>
  </div>
  }

  @if (localUserData() && selectedChatId()?.id && localUserData().id !==
  selectedChatId()?.id) {
  <app-chat
    [chatRoomId]="chatRoomId()"
    [localUserId]="localUserData().id"
    [senderName]="
      $safeNavigationMigration(selectedChatId()?.firstName) +
      ' ' +
      $safeNavigationMigration(selectedChatId()?.lastName)
    "
  />
  }
</div>
