<div>
            <h2 mat-dialog-title>{{title}}</h2>
            <mat-dialog-content class="mat-typography">
                <div>
                    <p>{{text}}</p>
                </div>
            </mat-dialog-content>
            <mat-dialog-actions >
                <div class="save-cancel-btn-container">
                    <button mat-button mat-stroked-button color="primary" [mat-dialog-close]="false">{{'delete_confirm_modal.cancel' | translate}}</button>
                    <button mat-button mat-raised-button color="primary"
                            [mat-dialog-close]="true"
                            cdkFocusInitial >{{'delete_confirm_modal.ok' | translate}}</button>
                </div>

            </mat-dialog-actions>

</div>
