<app-card
  [hidHeader]="false"
  [logoLoading]="loading"
  [cardTitle]="'notification_form.title' | translate"
>
  <div>
    <form [formGroup]="form">
      <div>
        <mat-form-field>
          <input
            matInput
            [placeholder]="'notification_form.title_placeholder' | translate"
            required
            formControlName="title"
          />
          @if (form.controls['title'].hasError('required')) {
          <mat-error>
            {{ 'notification_form.title_required' | translate }}
          </mat-error>
          }
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="width-full" appearance="fill">
          <textarea
            matInput
            class="noti-textarea"
            [placeholder]="'notification_form.message_placeholder' | translate"
            formControlName="message"
          ></textarea>
          @if (form.controls['message'].hasError('required')) {
          <mat-error>
            {{ 'notification_form.message_required' | translate }}
          </mat-error>
          }
        </mat-form-field>
      </div>

      <div>
        <button
          mat-raised-button
          color="primary"
          (click)="createNotification()"
        >
          {{ 'notification_form.submit' | translate }}
        </button>
        &nbsp; &nbsp;
      </div>
    </form>
  </div>
</app-card>
