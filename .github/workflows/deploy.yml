name: deploy

# Runs after main-ci succeeds on main (i.e. after a merge lands), not on
# every push - workflow_run always executes in the base repo's context
# with secrets available, which is why this pattern is safe for a public
# repo even though PR builds could otherwise come from untrusted forks.
on:
  workflow_run:
    workflows: ["main-ci"]
    types:
      - completed
    branches:
      - main

# Each push to main gets its own main-ci run, and each one that succeeds
# triggers this workflow separately - merging several PRs back-to-back can
# queue multiple deploy runs within seconds of each other. Every run
# builds and deploys whatever's currently on main, not a commit pinned to
# what triggered it, so an in-progress run has nothing to offer once a
# newer one starts - cancel it instead of building (and SSHing into the
# small production VPS) twice for the same end state.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The Angular build (packages/web/set-env.ts) bakes a handful of
      # public, non-secret values into the JS bundle - anyone loading the
      # site can read them - so they come from repo *variables*, not
      # secrets. Runtime secrets never pass through CI: the server fetches
      # them from Bitwarden Secrets Manager at deploy time (see
      # deploy-image.sh.example). The Dockerfile only COPYs this .env into
      # the intermediate web-build stage, never the final image.
      - name: Write public build config for the frontend
        env:
          API_VERSION: ${{ vars.API_VERSION }}
          APP_PORT: ${{ vars.APP_PORT }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
          IS_DEMO: ${{ vars.IS_DEMO }}
          IP_CHECKER_URL: ${{ vars.IP_CHECKER_URL }}
          FTP_DOMAIN: ${{ vars.FTP_DOMAIN }}
          LIVEKIT_PUBLIC_URL: ${{ vars.LIVEKIT_PUBLIC_URL }}
        run: |
          : "${BACKEND_DOMAIN:?Set the BACKEND_DOMAIN repo variable (Settings → Secrets and variables → Actions → Variables)}"
          for key in API_VERSION APP_PORT BACKEND_DOMAIN IS_DEMO IP_CHECKER_URL FTP_DOMAIN LIVEKIT_PUBLIC_URL; do
            printf '%s=%s\n' "$key" "${!key}"
          done > .env

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_PORT=4004
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/t-slen-crm/tslen-workhub:latest
            ghcr.io/t-slen-crm/tslen-workhub:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # The key on the server side has a forced command
          # (authorized_keys' command="...") that runs the actual
          # docker pull + restart sequence - whatever's passed here is
          # ignored server-side, this just establishes the session.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" true
