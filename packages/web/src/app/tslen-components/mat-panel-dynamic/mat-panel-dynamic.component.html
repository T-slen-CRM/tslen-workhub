<mat-accordion [multi]="multiExpanded">
  @for (panel of panels; track panel; let index = $index) {
  <mat-expansion-panel [expanded]="panel.expanded">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ panel.panelTitle }}
      </mat-panel-title>
      <mat-panel-description>
        {{ panel.description }}
      </mat-panel-description>
    </mat-expansion-panel-header>
    <ng-container [ngTemplateOutlet]="templates.get(index)"></ng-container>
  </mat-expansion-panel>
  }
</mat-accordion>
