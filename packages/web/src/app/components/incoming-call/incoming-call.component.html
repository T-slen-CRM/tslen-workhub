<div class="call-window">
    <div class="call-title">{{'call_model.incoming_call.title' | translate}}</div>
    <img class="avatar" [src]="data.img" alt="avatar">
    <div class="call-text">{{'call_model.incoming_call.text' | translate}} {{ data.callerName }} {{data.callerLastName}} ...</div>
    <div class="buttons">
        <button class="call-action-btn call-action-btn--reject" [attr.aria-label]="'call_model.incoming_call.button.no' | translate" (click)="reject()">
            <mat-icon>call_end</mat-icon>
        </button>
        <button class="call-action-btn call-action-btn--accept" [attr.aria-label]="'call_model.incoming_call.button.yes' | translate" (click)="accept()">
            <mat-icon>call</mat-icon>
        </button>
      </div>
</div>
